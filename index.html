<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Relative so it resolves correctly when hosted under a subpath. -->
    <link rel="icon" type="image/png" href="./logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CharacterBinder</title>
    <!--
      No web fonts. CharacterBinder claims that nothing leaves your machine, and
      fetching a stylesheet from fonts.googleapis.com on every launch handed
      Google the user's IP and User-Agent — and left the app dependent on the
      network to look right. The Tailwind stack still asks for Inter and
      JetBrains Mono first, so anyone who has them installed still gets them;
      everyone else falls back to their system UI font.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
